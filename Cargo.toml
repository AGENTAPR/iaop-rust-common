[workspace]
resolver = "3"
members = [
    "crates/iaop-errors",
    "crates/iaop-config",
    "crates/iaop-observability",
    "crates/iaop-http",
    "crates/iaop-security",
    "crates/iaop-messaging",
    "crates/iaop-persistence",
    "crates/iaop-resilience",
    "crates/iaop-client",
    "crates/iaop-health",
    "crates/iaop-idempotency",
    "crates/iaop-testing",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
jsonwebtoken = "9"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
